<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Aula Virtual | Detalle del Curso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, 'Segoe UI', 'Inter', 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #000000 0%, #044756 100%);
            min-height: 100vh;
            padding: 2rem;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
        }

        .detail-page {
            position: relative;
            background: rgba(255, 255, 255, 0.591);
            border-radius: 2.5rem;
            padding: 2rem 2rem 3rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 240, 0.7);
        }

        .detail-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .course-emoji-big {
            font-size: 5rem;
            display: block;
            margin-bottom: 1rem;
            filter: drop-shadow(2px 4px 8px rgba(0, 0, 0, 0.15));
        }

        .detail-header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #030b10, #1294db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .detail-header p {
            color: #041123;
            margin-top: 0.5rem;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 700;
            background: linear-gradient(120deg, #030b10, #1294db);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 2rem 0 1.5rem;
            text-align: center;
        }

        .unidades-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-top: 1rem;
        }

        .unidad-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.9), rgba(255, 255, 255, 0.7));
            border-radius: 1.5rem;
            padding: 1.8rem 1.2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid rgba(18, 148, 219, 0.2);
            text-decoration: none;
            display: block;
        }

        .unidad-card:hover {
            transform: translateY(-8px);
            border-color: #1294db;
            box-shadow: 0 15px 30px -12px rgba(0, 0, 0, 0.2);
            background: white;
        }

        .unidad-numero {
            background: linear-gradient(135deg, #1e3e5c, #2c4863);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .unidad-titulo {
            font-size: 1.3rem;
            font-weight: 700;
            color: #1f3e54;
            margin-bottom: 0.5rem;
        }

        .unidad-desc {
            font-size: 0.85rem;
            color: #5e7f97;
            line-height: 1.4;
        }

        .unidad-icono {
            font-size: 2rem;
            margin-bottom: 0.8rem;
            display: block;
        }

        .course-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin: 1.5rem 0;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 1.5rem;
        }

        .info-item {
            text-align: center;
            padding: 0.8rem;
        }

        .info-label {
            font-size: 0.75rem;
            color: #5e7f97;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 600;
            color: #1f3e54;
            margin-top: 0.3rem;
        }

        .toast-msg {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) scale(0.9);
            background: #1f3e54e6;
            backdrop-filter: blur(8px);
            color: white;
            padding: 0.8rem 1.8rem;
            border-radius: 60px;
            font-weight: 500;
            font-size: 1rem;
            z-index: 1000;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: none;
            box-shadow: 0 6px 14px black;
            white-space: nowrap;
        }

        .toast-msg.show {
            opacity: 1;
            transform: translateX(-50%) scale(1);
        }

        .admin-controls {
            position: absolute;
            top: 1.8rem;
            right: 1.8rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: flex-end;
            z-index: 10;
        }

        .admin-btn {
            background: linear-gradient(135deg, #1294db, #0d6fa5);
            color: white;
            padding: 0.8rem 1.3rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            box-shadow: 0 10px 25px rgba(18, 148, 219, 0.25);
            transition: 0.3s;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .admin-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            box-shadow: none;
        }

        .admin-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 30px rgba(18, 148, 219, 0.35);
        }

        .curso-bloqueado {
            text-align: center;
            padding: 3rem 2rem;
        }

        .curso-bloqueado .emoji-grande {
            font-size: 4rem;
            display: block;
            margin-bottom: 1rem;
        }

        .curso-bloqueado h2 {
            color: #1f3e54;
            font-size: 1.8rem;
            margin-bottom: 0.5rem;
        }

        .curso-bloqueado p {
            color: #5e7f97;
            font-size: 1.1rem;
        }

        @media (max-width: 700px) {
            body {
                padding: 1rem;
            }
            .detail-header h1 {
                font-size: 1.8rem;
            }
            .section-title {
                font-size: 1.4rem;
            }
            .unidades-grid {
                grid-template-columns: 1fr;
            }
            .toast-msg {
                white-space: normal;
                text-align: center;
                width: 90%;
                font-size: 0.9rem;
            }
            .admin-controls {
                position: static;
                margin: 1rem auto 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 0.75rem;
            }
            .admin-btn {
                position: static;
                margin: 0;
                right: auto;
                top: auto;
                display: inline-flex;
                font-size: 0.9rem;
                padding: 0.7rem 1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="detail-page">

            <div class="admin-controls">
                <button id="sendWorkBtn" class="admin-btn" type="button" disabled>⚠️ Cargando...</button>
            </div>

            <div class="detail-header">
                <span class="course-emoji-big" id="courseEmoji">📚</span>
                <h1 id="courseTitle">Cargando curso...</h1>
                <p id="courseDesc">Descripción del curso</p>
            </div>

            <div class="course-info-grid" id="courseInfo"></div>

            <h2 class="section-title">📚 Unidades del Curso</h2>
            <div class="unidades-grid" id="unidadesGrid"></div>
        </div>
    </div>

    <div id="toastMessage" class="toast-msg">✨ Mensaje</div>

    <script>
        // CONFIGURACION - URL DE APPS SCRIPT
        const CONFIG_URL = 'https://script.google.com/macros/s/AKfycby2y23kLt5P-r52eRWdUvs7s8oBEUasjcvUbTo3sAuugLF9br3qpTOFNRwlE_5R301E_w/exec';

        // DATOS DE CADA CURSO (LOS 7 CURSOS)
        const cursosDetalle = {
            1: {
                title: "Español y Filosofía",
                emoji: "📖",
                desc: "Literatura, gramática y pensamiento crítico",
                duracion: "4 semanas",
                nivel: "Básico",
                unidades: [
                    { num: 1, titulo: "La Oración y su Clasificación", desc: "Semana 1", icono: "📖", link: "unidad1-1.html" },
                    { num: 2, titulo: "Variaciones Lexicas", desc: "Semana 2", icono: "✍️", link: "unidad1-2.html" },
                    { num: 3, titulo: "La Narracion", desc: "Semana 3", icono: "💭", link: "unidad1-3.html" },
                    { num: 4, titulo: "Filosofis y Lectura Critica", desc: "Semana 4", icono: "⚖️", link: "unidad1-4.html" }
                ]
            },
            2: {
                title: "Matemáticas",
                emoji: "🧮",
                desc: "Aritmética, álgebra y razonamiento lógico",
                duracion: "4 semanas",
                nivel: "Básico",
                unidades: [
                    { num: 1, titulo: "Potenciación y Radicación", desc: "Semana 1", icono: "🔢", link: "unidad2-1.html" },
                    { num: 2, titulo: "Recta Numérica y Fracciones", desc: "Semana 2", icono: "✖️", link: "unidad2-2.html" },
                    { num: 3, titulo: "Geometría y Decimales", desc: "Semana 3", icono: "📐", link: "unidad2-3.html" },
                    { num: 4, titulo: "Repaso de la materia", desc: "Semana 4", icono: "📊", link: "unidad2-4.html" }
                ]
            },
            3: {
                title: "Sociales",
                emoji: "🌍",
                desc: "Historia, geografía y cultura general",
                duracion: "4 semanas",
                nivel: "Básico",
                unidades: [
                    { num: 1, titulo: "Etapas de la Historia", desc: "Semana 1", icono: "🏛️", link: "unidad3-1.html" },
                    { num: 2, titulo: "Cómo surge la Economía", desc: "Semana 2", icono: "🗺️", link: "unidad3-2.html" },
                    { num: 3, titulo: "Constitución Política de Colombia", desc: "Semana 3", icono: "🇨🇴", link: "unidad3-3.html" },
                    { num: 4, titulo: "Capitalismo y Socialismo", desc: "Semana 4", icono: "🗳️", link: "unidad3-4.html" }
                ]
            },
            4: {
                title: "Física",
                emoji: "⚡",
                desc: "Movimiento, energía y leyes del universo",
                duracion: "4 semanas",
                nivel: "Intermedio",
                unidades: [
                    { num: 1, titulo: "Movimiento y Aceleración", desc: "Semana 1", icono: "🏃", link: "unidad4-1.html" },
                    { num: 2, titulo: "Movimiento Uniforme Acelerado", desc: "Semana 2", icono: "⚙️", link: "unidad4-2.html" },
                    { num: 3, titulo: "Principio de ARQUIMIDES y principio de PASCAL", desc: "Semana 3", icono: "💡", link: "unidad4-3.html" },
                    { num: 4, titulo: "REPASO COMPLETO", desc: "Semana 4", icono: "🔌", link: "unidad4-4.html" }
                ]
            },
            5: {
                title: "Química",
                emoji: "🧪",
                desc: "Estructura de la materia y reacciones",
                duracion: "4 semanas",
                nivel: "Intermedio",
                unidades: [
                    { num: 1, titulo: "Modelos Atómicos", desc: "Semana 1", icono: "⚛️", link: "unidad5-1.html" },
                    { num: 2, titulo: "Números Cuánticos y Configuración Electrónica", desc: "Semana 2", icono: "📊", link: "unidad5-2.html" },
                    { num: 3, titulo: "Enlaces Químicos y Estructuras de Lewis", desc: "Semana 3", icono: "🧪", link: "unidad5-3.html" },
                    { num: 4, titulo: "Resumen General y Consolidación EXAMEN", desc: "Semana 4", icono: "🧴", link: "unidad5-4.html" }
                ]
            },
            6: {
                title: "Inglés",
                emoji: "🇬🇧",
                desc: "Vocabulario, gramática y conversación",
                duracion: "4 semanas",
                nivel: "Básico",
                unidades: [
                    { num: 1, titulo: "Verb TO BE", desc: "Semana 1", icono: "👋", link: "unidad6-1.html" },
                    { num: 2, titulo: "Numbers and Prepositions of Place: AT, IN, ON", desc: "Semana 2", icono: "📝", link: "unidad6-2.html" },
                    { num: 3, titulo: "Adjectives & Colors", desc: "Semana 3", icono: "🏠", link: "unidad6-3.html" },
                    { num: 4, titulo: "Question Words & Course Review", desc: "Semana 4", icono: "✈️", link: "unidad6-4.html" }
                ]
            },
            7: {
                title: "Biología",
                emoji: "🧬",
                desc: "Células, seres vivos y ecosistemas",
                duracion: "4 semanas",
                nivel: "Básico",
                unidades: [
                    { num: 1, titulo: "La Célula", desc: "Semana 1", icono: "🦠", link: "unidad7-1.html" },
                    { num: 2, titulo: "Reinos de la Naturaleza", desc: "Semana 2", icono: "🌿", link: "unidad7-2.html" },
                    { num: 3, titulo: "Cuerpo Humano", desc: "Semana 3", icono: "🧠", link: "unidad7-3.html" },
                    { num: 4, titulo: "Ecología", desc: "Semana 4", icono: "🌎", link: "unidad7-4.html" }
                ]
            }
        };

        // FUNCIONES DE CONFIGURACION CON APPS SCRIPT
        let configCache = null;
        let ultimaActualizacion = 0;
        const CACHE_TIME = 60000;

        const DEFAULT_MESES = { 1: 4, 2: 6, 3: 10, 4: 7, 5: 5, 6: 9, 7: 8 };
        const DEFAULT_ENVIOS = { 1: true, 2: true, 3: true, 4: true, 5: true, 6: true, 7: true };

        async function obtenerConfiguracion() {
            const ahora = Date.now();
            if (configCache && (ahora - ultimaActualizacion) < CACHE_TIME) {
                return configCache;
            }

            try {
                const response = await fetch(CONFIG_URL, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error('HTTP ' + response.status + ' - Verifica que el Apps Script esté desplegado como "Aplicación web" con acceso "Cualquiera, incluso anónimo".');
                }
                const text = await response.text();
                const lines = text.split('\n').filter(function(line) { return line.trim(); });
                const dataLines = lines.slice(1);
                const config = {
                    meses: Object.assign({}, DEFAULT_MESES),
                    envios: Object.assign({}, DEFAULT_ENVIOS),
                    global: null
                };
                dataLines.forEach(function(line) {
                    const cols = line.split(',').map(function(c) { return c.trim(); });
                    const id = parseInt(cols[0]);
                    const mes = parseInt(cols[1]);
                    const envios = cols[2] ? cols[2].toLowerCase() === 'true' : false;
                    if (!isNaN(id) && !isNaN(mes)) {
                        if (id === 0) {
                            config.global = envios;
                        } else {
                            config.meses[id] = mes;
                            if (cols[2] !== undefined) {
                                config.envios[id] = envios;
                            }
                        }
                    }
                });
                configCache = config;
                ultimaActualizacion = ahora;
                console.log('Configuracion cargada:', config);
                return config;
            } catch (error) {
                let errorMsg = '⚠️ No se pudo conectar a Google Sheets. ';
                if (error.message && error.message.includes('HTTP')) {
                    errorMsg += 'El script web no está desplegado o tiene problemas de permisos.';
                } else if (error.name === 'TypeError') {
                    errorMsg += 'Error de red/CORS. Asegúrate de que el script tenga cabeceras CORS y acceso público.';
                } else {
                    errorMsg += 'Verifica tu conexión e intenta recargar la página.';
                }
                console.error(errorMsg, error);
                showToast(errorMsg, 'error');
                return { meses: Object.assign({}, DEFAULT_MESES), envios: Object.assign({}, DEFAULT_ENVIOS), global: null };
            }
        }

        async function getMesCurso(cursoId) {
            const config = await obtenerConfiguracion();
            return config.meses[cursoId] || 0;
        }

        async function isSendEnabled(cursoId) {
            const config = await obtenerConfiguracion();
            if (config.global !== null) return config.global;
            return config.envios[cursoId] !== false;
        }

        async function isVisibleThisMonth(cursoId) {
            const mes = await getMesCurso(cursoId);
            if (!mes || mes === 0) return true;
            const hoy = new Date();
            return (hoy.getMonth() + 1) === mes;
        }

        // ACCESO PROFESOR
        const TEACHER_STORAGE_KEY = 'aula_teacher_unlocked';
        const TEACHER_EXPIRY_KEY = 'aula_teacher_expiry';

        function isTeacherUnlocked() {
            const unlocked = localStorage.getItem(TEACHER_STORAGE_KEY) === 'true';
            if (!unlocked) return false;
            const expiry = localStorage.getItem(TEACHER_EXPIRY_KEY);
            if (expiry) {
                const now = Date.now();
                if (now > parseInt(expiry)) {
                    localStorage.removeItem(TEACHER_STORAGE_KEY);
                    localStorage.removeItem(TEACHER_EXPIRY_KEY);
                    return false;
                }
            }
            return true;
        }

        // SISTEMA DE TOAST
        let toastTimeout = null;

        function showToast(message, type) {
            type = type || 'info';
            const toast = document.getElementById('toastMessage');
            toast.textContent = message;
            toast.className = 'toast-msg show';
            if (type === 'success') toast.style.background = '#28a745e6';
            else if (type === 'error') toast.style.background = '#dc3545e6';
            else toast.style.background = '#1f3e54e6';
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(function() {
                toast.className = 'toast-msg';
            }, 3000);
        }

        function getMonthName(monthNumber) {
            var meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
            if (!monthNumber || monthNumber < 1 || monthNumber > 12) return 'mes invalido';
            return meses[monthNumber - 1];
        }

        function isSendDay() {
            var hoy = new Date();
            var dia = hoy.getDay();
            return dia === 4 || dia === 5;
        }

        // LEER PARAMETROS DE LA URL
        var params = new URLSearchParams(window.location.search);
        var courseId = parseInt(params.get('id')) || 1;
        var curso = cursosDetalle[courseId];

        // INICIALIZAR DETALLE DEL CURSO
        var sendBtn = document.getElementById('sendWorkBtn');

        async function updateSendButtonState() {
            var sendToday = isSendDay();
            var enabled = await isSendEnabled(courseId);
            var active = enabled && sendToday;
            sendBtn.disabled = !active;
            if (active) {
                sendBtn.textContent = 'Enviar tarea disponible';
                sendBtn.title = 'Haz clic para enviar tu tarea';
            } else if (!sendToday) {
                sendBtn.textContent = 'Envios solo jueves y viernes';
                sendBtn.title = 'Hoy no es dia de envio';
            } else if (!enabled) {
                sendBtn.textContent = 'Envios deshabilitados por el profesor';
                sendBtn.title = 'El profesor deshabilito los envios';
            } else {
                sendBtn.textContent = 'Envios deshabilitados';
                sendBtn.title = 'Contacta al profesor';
            }
        }

        sendBtn.addEventListener('click', function() {
            if (!this.disabled) {
                window.location.href = 'enviar_tarea.html';
            } else {
                var text = this.textContent;
                if (text.indexOf('jueves y viernes') !== -1) {
                    showToast('Los envios solo estan activos jueves y viernes.', 'info');
                } else if (text.indexOf('deshabilitados por el profesor') !== -1) {
                    showToast('El profesor ha deshabilitado los envios.', 'error');
                } else {
                    showToast('El envio de tareas no esta disponible.', 'info');
                }
            }
        });

        async function initDetalleCurso() {
            if (!curso) {
                document.getElementById('courseTitle').textContent = 'Curso no encontrado';
                return;
            }
            document.getElementById('courseEmoji').textContent = curso.emoji;
            document.getElementById('courseTitle').textContent = curso.title;
            document.getElementById('courseDesc').textContent = curso.desc;
            document.title = 'Aula Virtual | ' + curso.title;

            var infoContainer = document.getElementById('courseInfo');
            var unidadesGrid = document.getElementById('unidadesGrid');

            var visible = await isVisibleThisMonth(courseId);
            var mesConfig = await getMesCurso(courseId);

            if (!visible && !isTeacherUnlocked()) {
                var mesNombre = getMonthName(mesConfig);
                infoContainer.innerHTML = `
                    <div class="curso-bloqueado" style="grid-column:1/-1;">
                        <span class="emoji-grande">🔒</span>
                        <h2>Curso no disponible</h2>
                        <p>Este curso estara disponible en <strong>${mesNombre}</strong>.</p>
                        <p style="margin-top:0.5rem; font-size:0.9rem; color:#8aa3b9;">Si eres profesor, activa el modo profesor para verlo.</p>
                    </div>
                `;
                unidadesGrid.innerHTML = '';
                sendBtn.disabled = true;
                sendBtn.textContent = 'Curso bloqueado';
                return;
            }

            infoContainer.innerHTML = `
                <div class="info-item"><div class="info-label">Duracion</div><div class="info-value">${curso.duracion}</div></div>
                <div class="info-item"><div class="info-label">Nivel</div><div class="info-value">${curso.nivel}</div></div>
                <div class="info-item"><div class="info-label">Certificado</div><div class="info-value">Incluido</div></div>
                <div class="info-item"><div class="info-label">Modalidad</div><div class="info-value">Virtual</div></div>
            `;

            if (curso.unidades && curso.unidades.length > 0) {
                var unidadesOrdenadas = curso.unidades.slice().sort(function(a, b) {
                    return a.num - b.num;
                });
                var htmlUnidades = '';
                unidadesOrdenadas.forEach(function(unidad) {
                    htmlUnidades += `
                        <a href="${unidad.link}" class="unidad-card">
                            <span class="unidad-icono">${unidad.icono}</span>
                            <div class="unidad-numero">${unidad.num}</div>
                            <div class="unidad-titulo">${unidad.titulo}</div>
                            <div class="unidad-desc">${unidad.desc}</div>
                        </a>
                    `;
                });
                unidadesGrid.innerHTML = htmlUnidades;
            } else {
                unidadesGrid.innerHTML = '<p style="text-align:center; grid-column:1/-1;">Unidades en construccion</p>';
            }

            await updateSendButtonState();
        }

        setInterval(async function() {
            await updateSendButtonState();
        }, 60000);

        initDetalleCurso();
    </script>
</body>
</html>
